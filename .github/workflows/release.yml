# 构建并发布 Windows 安装包
# 触发方式：推送 v* 标签（如 v0.1.0），或在 GitHub 网页 Actions 页面手动运行
name: Release (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 每个版本都要有自己的发布说明（docs/release-notes/v<版本>.md），缺了就在这里直接失败，不用等构建
      - name: 检查本版本的发布说明
        shell: bash
        run: node scripts/release-notes.mjs > /dev/null

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查与构建
        run: npm run build

      - name: Rust 测试（只用临时目录里生成的测试仓库）
        working-directory: src-tauri
        run: cargo test

  release:
    name: 构建并发布
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      # 建 Release 时只填这个版本的说明（docs/release-notes/v<版本>.md），它也会写进 latest.json，
      # 就是应用内"检查更新"显示的更新说明；Release 建好后再在网页上补上通用说明（下载、安装、更新）
      - name: 生成本版本的发布说明
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<SYNCDECK_RELEASE_NOTES_EOF'
            node scripts/release-notes.mjs --only-version
            echo 'SYNCDECK_RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 构建安装包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名：私钥与口令在仓库 Settings → Secrets 里配置
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          includeUpdaterJson: true
          releaseName: Git SyncDeck v__VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: ${{ steps.notes.outputs.body }}

      - name: Release 网页上补上通用说明
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$version" | gh release edit "v$version" --notes-file -
