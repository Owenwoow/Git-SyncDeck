[package]
name = "git-syncdeck"
version = "0.7.0"
description = "Git SyncDeck - 统一管理多个本地 Git 项目与 GitHub 的同步状态"
authors = ["Owenwoow"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "git_syncdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：常驻托盘；image-png：托盘图标从 icons/32x32.png 读取后再画上状态色点
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 开机自启（带 --autostart 参数启动时只进托盘）、系统通知、只允许运行一个实例
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步子进程（调用系统 git）、超时、并发限制
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# 读取 Windows 系统代理（注册表 HKCU\...\Internet Settings）
winreg = "0.56"
# 系统事件（锁屏/解锁、唤醒）：隐藏的顶层窗口 + 自己的消息循环
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[dev-dependencies]
# 测试里用模拟运行时直接调用 Tauri 命令
tauri = { version = "2", features = ["test"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
